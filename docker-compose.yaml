services:
  db:
    hostname: db
    image: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
  ui:
    image: ghcr.io/shortestpathlab/open-competition-kit/ui-service:latest
    ports:
      - "3007:80"
    depends_on:
      - db
    # competition.config.yaml resolves ${{ env("...") }} inside the container, so
    # the variables have to reach the container. Compose reads .env for its own
    # substitution but does not pass it on, and a missing variable is fatal: the
    # config fails to load at all rather than merely disabling GitHub.
    env_file: .env
    environment:
      # Set this to a random string in production
      BETTER_AUTH_SECRET: secret
      # Set this to your website's URL
      BASE_URL: http://localhost:3007
      # The whole project, not just the config file. `text()` and `dataUrl()`
      # resolve against the directory the config was found in, so the banner, the
      # icons and the evaluation program all have to be reachable from there.
      # Mounting the directory is also what keeps a new file from needing a new
      # line here.
      CONFIG: /competition/competition.config.yaml
    volumes:
      - ./:/competition
      # Submission archives. This volume MUST be mounted at the same path in the
      # runner too: the UI writes the archive, the runner reads it. Mount it in
      # only one and every job fails with "no such file".
      #
      # Swapping large-files/local for large-files/s3 removes this requirement
      # entirely, which is what makes multi-host deployments possible.
      - ./data:/data
  runner-service:
    image: ghcr.io/shortestpathlab/open-competition-kit/runner-service:latest
    depends_on:
      - db
    # The runner reads the same config, so it needs the same variables.
    env_file: .env
    environment:
      CONFIG: /competition/competition.config.yaml
    volumes:
      # The evaluation program, the recipe for the image it runs in, and the
      # table it scores against are all in here and all inlined when the config
      # loads. There is nothing to build beforehand and no package to install.
      - ./:/competition
      # Same volume, same path as the UI.
      - ./data:/data
      # Lets machine-docker run evaluations in their own containers, which is
      # what keeps a submitted Pacman agent out of this one. The containers it
      # starts are siblings on the host's daemon, not children.
      #
      # This is a real grant: anything that can reach this socket can control
      # Docker on the host, and therefore the host. It is why the evaluation
      # image is built from the recipe in the config and never from anything a
      # participant sends.
      - /var/run/docker.sock:/var/run/docker.sock
