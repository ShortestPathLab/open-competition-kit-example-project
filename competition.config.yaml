# Absolute, because these are the kit's own packages and they live inside the
# service images at /packages. A relative entry would be resolved against the
# directory this file was found in, which is the project directory rather than
# the image's root.
with:
  # The first three are applied to every config whether or not anybody writes
  # them. They are written here because the kit's own packages are baked into the
  # images: an unnamed default is fetched from npm, where these entries point at
  # what is already on disk.
  - /packages/packages/noop
  - /packages/packages/standard
  - /packages/packages/machine/local
  - /packages/packages/db/prisma
  - /packages/packages/form/json
  - /packages/packages/leaderboard/ag-grid
  - /packages/packages/large-files/local
  # Opening and closing times, an attempt ceiling, and a rolling rate limit. Not
  # a default: a competition that gates nothing should not have to answer for the
  # vocabulary, and a package that declares config fields is a package an
  # organiser asked for.
  - /packages/packages/gates/standard
  # Where a command runs. This one gives each evaluation a container of its own
  # and needs the Docker socket mounted into the runner, as in
  # docker-compose.yaml. Leave it out and each evaluation runs as a child process
  # of the runner service instead, which is enough to try an evaluation out and
  # not enough to accept a stranger's code.
  - /packages/packages/machine/docker
  # Evaluates with the program in `runner:` below. Listed after `standard` so its
  # runner sits further out, and it is the only thing here that evaluates
  # anything: without a runner package a submission is stored and never scored.
  - /packages/packages/runner/script
  - /packages/packages/integration/github-classic
name: GPPC
description: >
  GPPC hosts the FIT5047 Pacman Competition at Monash University, where
  participants build Pacman agents and compare their performance under a shared
  evaluation setup. Enrol in a track, submit your agent, and see how it ranks on
  the leaderboard.
# Who can reach /dashboard, matched against the signed-in user's email. Leave it
# out and nobody can: the dashboard fails closed, since an unguarded organiser
# surface is worse than an unreachable one. Read from the environment because
# this file is committed and an email address is not everybody's to share.
admins:
  - ${{ env("ADMIN_EMAIL") }}
secrets:
  GITHUB_ORG: ${{ env("GITHUB_ORG") }}
  GITHUB_PAT: ${{ env("GITHUB_PAT") }}
auth:
  email:
    providerOptions: {}
    betterAuthOptions: {}
    signInParams: {}
    signOutParams: {}
    signUpParams: {}
  github:
    providerOptions:
      clientId: ${{ env("GITHUB_CLIENT_ID") }}
      clientSecret: ${{ env("GITHUB_CLIENT_SECRET") }}
    betterAuthOptions: {}
    signInParams: {}
    signOutParams: {}
    signUpParams: {}
# Where submission archives are stored. The volume below MUST be mounted into
# every service that reads or writes them — the UI writes, the runner reads.
files:
  root: /data/files
  maxBytes: 536870912
# The ceiling on any run. A runner may ask for less, never for more. Declared by
# the machine package that enforces it, so these keys are only valid with one
# installed that understands them.
machine:
  timeoutMs: 120000
  memoryMb: 2048
  pids: 256
db:
  provider: postgresql
  url: postgres://postgres:postgres@db:5432/postgres
competitions:
  - id: "fit5047"
    name: "FIT5047 Pacman Competition"
    organiser: "Monash University"
    # Both pictures are read off disk and inlined into the config, so they are
    # versioned alongside the competition that uses them and there is no host to
    # go down. An ordinary https:// URL works here too.
    #
    # `icon` stands in for the competition wherever it is named: its card on the
    # index, its own header, the list of competitions somebody has entered.
    icon: ${{ dataUrl("./assets/competition-icon.svg") }}
    # `banner` is painted behind the navigation bar and header on every page
    # inside this competition. What shows is a horizontal band through the
    # middle, so keep anything that matters near the centre, and give it a wide
    # picture rather than a square one.
    banner: ${{ dataUrl("./assets/banner.svg") }}
    description: >
      A programming competition for FIT5047 where participants build Pacman
      agents and compare their performance under a shared evaluation setup.
    overview: |
      # FIT5047 Pacman Competition

      In this competition, you'll design and implement an intelligent agent to
      navigate a maze as efficiently as possible. Your agent will be evaluated
      based on its ability to collect all the dots in the maze while avoiding
      ghosts. The competition consists of a single track where you can submit
      your agent for evaluation against a set of hidden mazes. Get ready to
      showcase your problem-solving skills and creativity in building the best
      Pacman agent!

    rules: |
      - Your agent must be implemented in Python and adhere to the provided
        interface.
      - You can submit multiple times, but only your best score will be recorded.
      - The evaluation will be based on a hidden set of mazes, and your agent's
        performance will be measured by the time taken to collect all dots and the
        number of times it gets caught by ghosts.
      - The competition will run for a specified duration, and all submissions must
        be made before the deadline.
    tracks:
      - id: "main"
        name: "Main Track"
        # A track has an icon of its own and no banner: the banner belongs to the
        # competition, and a track's pages sit inside it.
        icon: ${{ dataUrl("./assets/track-icon.svg") }}
        description: >
          The standard competition track for submitting and evaluating your
          Pacman agent.
        overview: |
          # Main Track

          In the Main Track, you'll submit your Pacman agent for evaluation against
          a hidden set of mazes. Your agent will be scored based on its efficiency
          in collecting dots and avoiding ghosts. This is the primary track of the
          competition where you can compete for the top spot on the leaderboard.
        rules: |
          - Submissions must be made in Python and follow the provided agent interface.
          - You can submit as many times as you like, but only your best score will
            be recorded on the leaderboard.
          - The evaluation will be conducted on a hidden set of mazes, and your
            agent's performance will be measured by the time taken to collect all
            dots and the number of times it gets caught by ghosts.
          - The competition will run for a specified duration, and all submissions
            must be made before the deadline.
        # The three gates the `gates-standard` package enforces. Each is optional
        # and each is off when absent, so a track that sets none of them behaves
        # as though the package were not installed. A submission is refused if
        # any of them says no, and the form shows every reason at once rather
        # than making a competitor fix one to discover the next.
        #
        # The window. Submissions before `opensAt` or at/after `closesAt` are
        # refused wherever they arrive from, not just from the form. Always write
        # an offset: without one the instant is read in the host's timezone, which
        # is rarely the one the deadline was set in.
        opensAt: "2026-07-01T09:00:00+10:00"
        closesAt: "2027-07-01T09:00:00+10:00"
        # The total ceiling, per competitor, for the life of the track. Counts
        # submissions rather than evaluations, so an organiser re-running a job
        # does not spend somebody's attempt.
        maxSubmissions: 20
        # A rolling cap: at most `count` in any `windowMinutes` period, measured
        # backwards from now. Fixed hourly buckets would let someone spend a whole
        # quota at 10:59 and another at 11:00.
        rateLimit:
          count: 3
          windowMinutes: 60
        form:
          shape:
            - id: github:ref
              name: GitHub Branch
              # The GitHub integration package picks this up
              # and populates a selector with the user's branches
              kind: github:ref-select

    # The whole evaluation, as one Python file and the table it scores against.
    # No package, no node_modules and nothing mounted: everything below is
    # inlined when the config loads, so the competition travels as this file and
    # its neighbours.
    runner:
      # The evaluation image, built when the runner service starts and named
      # after the contents of this recipe. Editing pacman.dockerfile changes the
      # name, which makes it a different image, which rebuilds. A fixed tag
      # cannot do that, and a competition scored against last week's harness
      # reports nothing unusual while it happens.
      build:
        dockerfile: ${{ text("./pacman.dockerfile") }}
        args:
          # `fit5047a1` is the assignment harness; master is the capture-the-flag
          # contest.
          PACMAN_REF: fit5047a1
      # What runs, once per phase, from the directory `include:` fills. The kit
      # knows no language: it starts this and the program reads a JSON file. A Go
      # binary or a shell script would be configured exactly the same way.
      command: ["python3", "evaluate.py"]
      # The program, and the table it scores against. Copied in and never read by
      # the kit: what a case is, and what one is worth, belongs to the
      # competition rather than to a vocabulary the kit would have to invent.
      include:
        evaluate.py: ${{ text("./evaluate.py") }}
        cases.yaml: ${{ text("./cases.yaml") }}
      # Passed to every phase untouched. The full suite is minutes per
      # submission and q1a alone is seconds, which is what you want while you are
      # still setting things up.
      params:
        questions: [q1a]
      # The seven files a student may edit. Everything else in the archive is
      # dropped before any container starts, which is what makes an edited
      # pacman.py, a rewritten layout or a sitecustomize.py into non-issues.
      submission:
        allow:
          - agents/q2Agent.py
          - problems/q1a_problem.py
          - problems/q1b_problem.py
          - problems/q1c_problem.py
          - solvers/q1a_solver.py
          - solvers/q1b_solver.py
          - solvers/q1c_solver.py
      # Per case, not per submission. Forty instances each get this much, and one
      # that wedges its interpreter takes nothing with it but its own container.
      timeoutMs: 90000
      limits:
        memoryMb: 2048
        cpus: 1
    leaderboards:
      - id: main-track-leaderboard
        name: Main Track Leaderboard
        description: Best scoring run per participant, highest total first.
        # Rows come from real finished jobs. `from` takes precedence over
        # `items`, which used to hold invented teams scoring on tracks
        # ("Vision", "NLP", "Forecasting") this competition does not have.
        from:
          track: main
          # The reference fit5047's runner writes its scores to, in full. Leave
          # it out and the board reads the bare "default"; this runner writes the
          # qualified tag, and a mismatch here is silent, so the board simply
          # stays empty.
          output: open-competition-kit/tag/output/default
          # One row per participant: their best run, not their latest.
          groupBy: user
          select: best
          rank:
            # score1..score4 summed by the runner. Max is 55.
            field: total
            order: desc
          limit: 50
        # `rank`, `user`, `track` and `submittedAt` are supplied for every row;
        # the rest are the runner's own output fields.
        shape:
          - id: rank
            name: Rank
            kind: number
          - id: user
            name: Participant
          - id: total
            name: Score
            kind: number
          - id: runtime
            name: Runtime (ms)
            kind: number
          - id: submittedAt
            name: Submitted
            kind: date
