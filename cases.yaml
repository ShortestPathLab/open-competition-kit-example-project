# What the suite runs, and what each instance is worth.
#
# Read by evaluate.py, and by nothing else. Open Competition Kit copies this file
# into the evaluation container because competition.config.yaml lists it under
# `include:`, and never looks inside it: what a case is, and what makes one worth
# a point, is the competition's business rather than the kit's.
#
# `benchmark` is what a reference solution achieved. `floor` is the smallest
# honest answer, used only by q1b: a search cannot expand fewer nodes than the
# path it returns is long, so anything below it is a broken heuristic or a
# hardcoded answer, and scores zero.
#
# `mode` picks how the harness is invoked. `search` runs a solver through
# SearchAgent; `agent` runs a reflex agent against ghosts. `timeLimit` is the
# harness's own limit, in seconds, per instance.
#
# These are not the course's marking benchmarks. See the note at the top of
# evaluate.py.
#
# q2_dangerClassic.lay is left out on purpose: the reference scores -169 on it,
# and a non-positive score floors to 0, so the layout could only ever award
# nothing.

q1a:
  mode: search
  timeLimit: 1
  instances:
